name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      JOY_HARNESS_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show native toolchain
        run: |
          test "$(uname -m)" = "$JOY_HARNESS_ARCH"
          xcodebuild -version
          swift --version

      - name: Run native checks
        run: scripts/test_all.sh

      - name: Build and verify native app
        env:
          JOY_HARNESS_ALLOW_ADHOC: '1'
        run: |
          scripts/build_app.sh "$RUNNER_TEMP/JoyHarness.app"
          test "$(lipo -archs "$RUNNER_TEMP/JoyHarness.app/Contents/MacOS/JoyHarness")" = "$JOY_HARNESS_ARCH"

      - name: Package preview DMG
        run: scripts/package_dmg.sh "$RUNNER_TEMP/JoyHarness.app" "$RUNNER_TEMP/JoyHarness-ci-macos-$JOY_HARNESS_ARCH.dmg"

      - name: Upload preview DMG
        uses: actions/upload-artifact@v7
        with:
          name: JoyHarness-ci-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/JoyHarness-ci-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
